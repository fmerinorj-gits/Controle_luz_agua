name: Manter App Luz e Agua Acordado

on:
  schedule:
    # Roda a cada 4 horas (23h, 03h, 07h, 11h, 15h e 19h no horário de Brasília)
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch:

jobs:
  acordar_streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar Navegador Chrome Invisivel
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Visitar e Acordar o Aplicativo
        run: |
          python - << 'EOF'
          import asyncio
          from playwright.async_api import async_playwright

          URLS = [
              "https://controle-luz-agua.streamlit.app/"
          ]

          async def visitar_app(page, url):
              print(f"Acessando: {url}")
              try:
                  await page.goto(url, wait_until="domcontentloaded", timeout=90000)
                  await page.wait_for_timeout(12000)
                  
                  botao_acordar = page.locator("button:has-text('Yes, get this app back up!')")
                  if await botao_acordar.count() > 0:
                      print(f"App dormindo! Clicando no botao para acordar: {url}")
                      await botao_acordar.click()
                      await page.wait_for_timeout(50000)
                      print(f"App acordado com sucesso: {url}")
                  else:
                      await page.wait_for_timeout(10000)
                      print(f"App ja estava acordado! Tempo renovado: {url}")
              except Exception as e:
                  print(f"Aviso ao acessar {url}: {e}")

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)
                  context = await browser.new_context()
                  page = await context.new_page()
                  for url in URLS:
                      await visitar_app(page, url)
                  await browser.close()

          asyncio.run(main())
          EOF
